[project]
name = "ai-business-assistant"
version = "0.1.0"
description = "AI-powered business assistant"
readme = "README.md"
authors = [
    { name = "Fabian Valdes", email = "fvaldesmoreno@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_business_assistant"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
